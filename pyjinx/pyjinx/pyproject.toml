[tool.poetry]
name = "pyjinx-starter"
version = "0.0.1"
description = "PoC starter template for pyjinx framework"
authors = ["PyJinx contributors"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
# PoC setup points at local framework repo as git module/develop dependency.
# Keep this as a local path until the framework is published.
pyjinx = { path = "../..", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
